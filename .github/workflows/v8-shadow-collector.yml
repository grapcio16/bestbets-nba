name: HOOPZARO V8 shadow — isolated pregame research

on:
  push:
    branches: [main]
    paths:
      - 'v8_shadow/**'
      - '.github/workflows/v8-shadow-collector.yml'
  schedule:
    - cron: '17 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hoopzaro-v8-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TRACKER_DATABASE_URL: ${{ secrets.TRACKER_DATABASE_URL }}
      HOOPZARO_V8_BOX_FETCH_LIMIT: '24'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require durable Neon storage; never use SQLite
        run: |
          if [ -z "$TRACKER_DATABASE_URL" ]; then
            echo "::error::V8 Shadow needs existing TRACKER_DATABASE_URL secret."
            exit 1
          fi
      - name: Install research-only worker dependencies
        run: python -m pip install -q 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'requests>=2.31,<3' 'psycopg[binary]>=3.2,<4'
      - name: Archive verified possessions and freeze out-of-time V8 forecasts
        run: python -m v8_shadow.worker
