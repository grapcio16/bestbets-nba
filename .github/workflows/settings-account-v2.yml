name: Settings and Account v2 — isolated QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'bestbets_reference_frontend/settings_account_v2.*'
      - 'bestbets_reference_frontend/index.html'
      - 'access_control.py'
      - 'test_access_control.py'
      - 'test_settings_account_v2_browser.py'
      - '.github/workflows/settings-account-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  settings:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_access_control.py
      - run: node --check bestbets_reference_frontend/settings_account_v2.js
      - run: |
          python -m pip install 'playwright>=1.58,<2'
          python -m playwright install --with-deps chromium
      - run: python test_settings_account_v2_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-account-v2-screenshots
          path: test-results/settings-account-v2/
          if-no-files-found: ignore
