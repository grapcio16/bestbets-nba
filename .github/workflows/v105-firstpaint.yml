name: BestBets v10.5 genuine first paint
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-paint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app and Chromium
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Launch Streamlit
        run: |
          python -m streamlit run app.py --server.headless true --server.port 8501 --server.address 127.0.0.1 >/tmp/bestbets-v105.log 2>&1 &
          for i in $(seq 1 80); do
            curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat /tmp/bestbets-v105.log
          exit 1
      - name: Verify initial scale and stable fullscreen in real app
        run: python test_streamlit_firstpaint_v105.py
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bestbets-firstpaint-v105
          if-no-files-found: ignore
          path: |
            bestbets_firstpaint_v105.png
            /tmp/bestbets-v105.log
