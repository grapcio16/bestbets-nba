name: Premium role cache isolated QA
on:
  push:
    branches: [fix/premium-role-cache-regression]
  pull_request:
    branches: [feature/data-intelligence-v1]
    paths: ['test_centre_bootstrap.py', '.github/workflows/premium-role-cache-isolated.yml']
permissions:
  contents: read
jobs:
  regression:
    if: github.event_name == 'push' || github.head_ref == 'fix/premium-role-cache-regression'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_centre_bootstrap
