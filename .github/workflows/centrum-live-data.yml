name: BestBets Centrum verified NBA data and player stats
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nba-data-and-real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: |
          python -m pip install -r requirements.txt "playwright>=1.56,<2"
          python -m playwright install --with-deps chromium
      - name: Compile real-data backend and validate mocked ESPN snapshots
        run: |
          python -m py_compile bestbets_centre_live.py bestbets_centre_data.py bestbets_custom_screen.py test_centre_live_data.py
          python -m unittest -v test_centre_live_data test_centre_data test_free_analyses
      - name: Free leaders, safe details and opt-in photos in Playwright
        run: python test_free_analyses_browser.py
      - name: Pixel baseline, browser fixture and unchanged Props
        run: python test_browser_reference_v10.py
      - name: Start production entrypoint WITHOUT deployment
        run: |
          python -m streamlit run app.py --server.port 8501 --server.headless true > /tmp/centre-data.log 2>&1 &
          for n in $(seq 1 65); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -100 /tmp/centre-data.log
          exit 1
      - name: End-to-end Streamlit, no fabricated stats, no black screen
        run: python test_centre_browser.py
      - name: Save visual and startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bestbets-centrum-live-verified-data-preview
          path: |
            work/centrum-qa/
          if-no-files-found: ignore
