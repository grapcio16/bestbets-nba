name: BestBets — automatic pregame tracking and results

on:
  # GitHub cron executes in UTC, not the visitor's timezone. Delays are possible.
  schedule:
    - cron: '25 7,12,18,23 * * *'
  # Owner can run the same idempotent job on demand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bestbets-automatic-tracker
  cancel-in-progress: false

jobs:
  tracker-auto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRACKER_DATABASE_URL: ${{ secrets.TRACKER_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require durable storage
        run: |
          if [ -z "$TRACKER_DATABASE_URL" ]; then
            echo "::error::BestBets automatic tracker not configured. Add a PostgreSQL connection URL as GitHub Actions repository secret TRACKER_DATABASE_URL."
            exit 1
          fi
      - name: Install worker dependencies
        run: python -m pip install -q pandas numpy requests 'psycopg[binary]>=3.2,<4'
      - name: Archive pregame snapshots and settle completed NBA results
        run: python tracker_automation.py
