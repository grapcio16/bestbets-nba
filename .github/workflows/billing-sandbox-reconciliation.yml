name: Billing sandbox reconciliation
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: billing-sandbox-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: vars.HOOPZARO_BILLING_RECONCILE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - run: python billing_sandbox_reconcile.py
        env:
          HOOPZARO_BILLING_RECONCILE_ENABLED: 'true'
          HOOPZARO_BILLING_RECONCILE_CONFIG: ${{ secrets.HOOPZARO_BILLING_RECONCILE_CONFIG }}
