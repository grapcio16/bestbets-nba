name: BestBets Stripe sandbox safety
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stripe-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bestbets_test
          POSTGRES_PASSWORD: ci_sandbox_only
          POSTGRES_DB: bestbets_billing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bestbets_test -d bestbets_billing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_BILLING_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://bestbets_test:ci_sandbox_only@127.0.0.1:5432/bestbets_billing_test' || '' }}
      BILLING_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://bestbets_test:ci_sandbox_only@127.0.0.1:5432/bestbets_billing_test' || 'sqlite:////tmp/bestbets-billing-migrations.sqlite3' }}
      BILLING_ALLOW_SQLITE_TEST: ${{ matrix.database == 'sqlite' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated backend dependencies
        run: python -m pip install -r requirements-billing-sandbox.txt 'pytest>=8,<10' 'httpx>=0.27,<1'
      - name: Compile and verify versioned migrations
        run: |
          python -m compileall -q billing_backend stripe_test_billing.py
          python -m alembic -c alembic-billing.ini upgrade head
          python -m alembic -c alembic-billing.ini check
      - name: Real JWT signatures, webhook signatures, DB transactions and API tests
        run: python -m pytest -q billing_backend/tests test_stripe_test_billing.py --junitxml=billing-tests.xml
      - name: Public application remains unchanged
        if: github.event_name == 'pull_request'
        env:
          BILLING_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --exit-code "$BILLING_BASE_SHA" HEAD -- app.py bestbets_custom_screen.py bestbets_reference_frontend assets requirements.txt
      - name: Check accidental secret material
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          paths=[Path('stripe_test_billing.py'),Path('test_stripe_test_billing.py'),*Path('billing_backend').rglob('*.py'),*Path('docs').glob('*STRIPE*.md')]
          pattern=re.compile(r'(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{24,}|whsec_[A-Za-z0-9]{24,}')
          for path in paths:
              assert not pattern.search(path.read_text()), f'Possible secret in {path}'
          assert 'stripe' not in Path('app.py').read_text().lower()
          print('Sandbox backend isolated; no realistic Stripe credentials found.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bestbets-billing-tests-${{ matrix.database }}
          path: billing-tests.xml
