name: BestBets Stripe sandbox safety
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stripe-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax and offline security tests
        run: |
          python -m py_compile stripe_test_billing.py test_stripe_test_billing.py
          python -m unittest -v test_stripe_test_billing
      - name: No secrets and no accidental live activation
        run: |
          python - <<'PY'
          from pathlib import Path
          files=[
              Path("stripe_test_billing.py"),
              Path("docs/STRIPE_BESTBETS_SANDBOX.md"),
              Path("test_stripe_test_billing.py"),
          ]
          backend=Path("stripe_test_billing.py").read_text(encoding="utf-8")
          app=Path("app.py").read_text(encoding="utf-8")
          assert 'sk_test_' in backend
          assert 'sk_live_' not in app
          assert 'stripe_test_billing' not in app
          assert 'create_test_gateway' in backend
          assert 'Webhook.construct_event' in backend
          assert 'streamlit' not in backend.lower()
          assert not any('sk_live_' in s.read_text(encoding="utf-8")
                         for s in [Path("stripe_test_billing.py")])
          print("Billing sandbox is isolated from public BestBets.")
          PY
