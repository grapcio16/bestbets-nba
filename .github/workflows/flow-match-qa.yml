name: HOOPZARO Premium Flow meczu QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flow-premium:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python and Chromium
        run: |
          python -m pip install -r requirements.txt 'playwright>=1.58,<2'
          python -m playwright install --with-deps chromium
      - name: Validate source syntax
        run: |
          python -m py_compile simulation_sources.py simulation_quarter_model.py simulation_flow.py flow_report.py bestbets_simulations_canvas.py bestbets_custom_screen.py test_simulation_quarter_model.py test_simulation_flow.py test_flow_match_browser.py
          node --check bestbets_reference_frontend/flow_match.js
          node --check bestbets_reference_frontend/simulations.js
      - name: Verify ESPN regulation quarters, no lookahead, 5000-run score preservation and PDF
        run: python -m unittest -v test_simulation_quarter_model test_simulation_flow
      - name: Chromium Premium Flow smoke on desktop and mobile
        run: python test_flow_match_browser.py
      - name: Responsive visual reachability for seven Premium modules
        run: python test_simulation_lab_six_views_responsive.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hoopzaro-flow-visual-review
          path: test-results/hoopzaro-responsive/simlab-flow-*.png
          if-no-files-found: ignore
