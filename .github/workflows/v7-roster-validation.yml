name: BestBets MVP quality checks
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -q pandas numpy plotly streamlit requests pillow 'psycopg[binary]>=3.2,<4'
      - name: Compile all active screens and research engines
        run: |
          python -m py_compile app.py bestbets_custom_screen.py mvp_app.py mvp_theme.py mvp_reference_theme.py mvp_reference_footer.py mvp_data.py mvp_prop_ui.py mvp_player_card.py
          python -m py_compile simulation_view.py simulation_premium.py simulation_engine.py simulation_data_audit.py simulation_sources.py
          python -m py_compile roster_view.py roster_data.py global_player_catalog.py season_props.py
          python -m py_compile screenshot_ui.py screenshot_cards.py screenshot_import.py prop_search.py prediction_engine_v2.py
          python -m py_compile schedule_ui.py schedule_data.py viewer_time.py
          python -m py_compile tracker_automation.py tracker_storage.py tracker_postgres.py
      - name: Regression suite — NBA and UI business logic
        run: |
          python -m unittest -v test_custom_reference_v10.py test_reference_layout_v83.py test_player_props_pra_v82.py test_simulation_premium_v81.py test_mvp_v800.py test_prop_search_v723.py test_screenshot_v722.py test_season_props_v721.py test_tracker_v720.py test_simulation_lines_v719.py test_prediction_v718.py test_screen_v717.py test_rotation_v716.py test_simulation_data_audit.py test_center_v713.py test_center_v712.py test_center_v711.py test_schedule_v710.py test_nov8.py test_roster_data.py test_matchup_roster.py test_forecast_audit.py test_calculator_catalog.py test_performance_tracker.py test_v75.py test_v76.py test_v77.py test_v78.py test_v78_tracker.py
      - name: Product scope and research isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          import mvp_app
          from mvp_theme import MVP_CSS
          from prop_search import parse_prop_batch
          source=Path('app.py').read_text(encoding='utf8')
          assert 'from bestbets_custom_screen import main' in source
          assert 'screenshot_ui' not in source and 'odds_fetcher' not in source
          core=[x for x,_ in mvp_app.MAIN_PAGES]
          extra=[x for x,_ in mvp_app.EXTRA_PAGES]
          assert core==['home','props','games','simulations','players','teams']
          assert extra==['favorites','trends','tools','settings']
          for token in ('bbm-topbar','bbm-player-head','bbm-card','bbm-sidebar-footer','--bb-orange','--bb-blue'):
              assert token in MVP_CSS,token
          assert 'score_line_probabilities(' not in Path('simulation_engine.py').read_text(), '5000-draw engine was changed'
          assert "run_scheduled_job" in Path('tracker_automation.py').read_text(), 'Tracker worker deleted'
          assert Path('.github/workflows/tracker-auto.yml').exists()
          queries,errors=parse_prop_batch('Jason Tatum uver 25,5 point\nJayson Tatum under 3.5 asist\nJayson Tatum over 2.5 three-pointers')
          assert len(queries)==3 and not errors
          assert [x['market'] for x in queries]==['PTS','AST','FG3M']
          print('MVP lean, core simulations intact, archived modules remain')
          PY
      - name: Public custom canvas — initial state and Python handshake
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          from pathlib import Path
          at=AppTest.from_file('app.py',default_timeout=90).run()
          assert not at.exception,[str(e.message) for e in at.exception]
          html=Path('bestbets_reference_frontend/index.html').read_text(encoding='utf8')
          assert 'streamlit:componentReady' in html
          assert 'streamlit:setComponentValue' in html
          assert 'streamlit:render' in html
          assert 'id="search-form"' in html
          for route in ('home','simulations','games','players','teams','shortcuts'):
              assert 'id="card-'+route+'"' in html
          print('Custom Player Props component and all six preview links are wired.')
          PY
      - name: Frontend JavaScript syntax and exact reference canvas
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('bestbets_reference_frontend/index.html').read_text(encoding='utf8')
          match=re.search(r'<script>(.*?)</script>',html,re.S)
          assert match, 'Frontend JavaScript missing'
          Path('/tmp/bestbets_custom_v10.js').write_text(match.group(1),encoding='utf8')
          assert 'width:1231px;height:691px' in html
          PY
          node --check /tmp/bestbets_custom_v10.js
      - name: Simulation premium details — compact responsive cards, no old debug wall
        run: |
          python - <<'PY'
          from pathlib import Path
          details=Path('simulation_view.py').read_text(encoding='utf8')
          helpers=Path('simulation_premium.py').read_text(encoding='utf8')
          assert 'game_tile_html(' in details
          assert 'matchup_hero_html(' in details
          assert 'compact_team_context_html(' in details
          assert 'player_previews_html(' in details
          assert 'for index in range(0,len(games_list),2):' in details
          assert "view==\"🔬 Dane i metodologia\"" in details
          assert '🩺 Rotacja i absencje' in details
          assert '🎯 Linie i wrażliwość' in details
          assert '📊 Rozkład punktów' in details
          assert 'player_previews_html' in helpers
          assert 'saved forecasts' not in helpers
          print('New compact simulation game and matchup details are wired')
          PY
      - name: Approved visual design and archived layout source regression
        run: |
          python - <<'PY'
          from pathlib import Path
          from mvp_reference_theme import REFERENCE_CSS
          from mvp_reference_footer import FOOTER_TILES
          assert len(FOOTER_TILES)==5
          assert 'bb83-rate-grid' in REFERENCE_CSS
          assert 'bb83-take' in REFERENCE_CSS
          shell=Path('bestbets_custom_screen.py').read_text(encoding='utf8')
          html=Path('bestbets_reference_frontend/index.html').read_text(encoding='utf8')
          assert 'declare_component(' in shell
          assert 'clean_player_season(' in shell
          assert 'prefers-reduced-motion:reduce' in html
          assert 'id="hero"' in html
          assert 'id="chart-svg"' in html
          assert 'id="side-stats"' in html
          assert 'id="footer"' in html
          print('Reference canvas and original NBA analysis modules preserved.')
          PY
      - name: Loaded player card — real interactive controls and graph smoke
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          code = """
          import pandas as pd
          import streamlit as st
          from mvp_theme import apply_mvp_theme
          from mvp_reference_theme import apply_reference_theme
          from mvp_player_card import render_player_card
          apply_mvp_theme()
          apply_reference_theme()
          rows=pd.DataFrame([{
              'PLAYER_NAME':'Fixture Player','PLAYER_ID':'123',
              'TEAM_ABBREVIATION':'BOS',
              'GAME_ID':str(i),'GAME_DATE':pd.Timestamp('2026-10-20T00:00:00Z')+pd.Timedelta(days=i),
              'MIN':31.0,'PTS':18+i%9,'REB':5+i%4,'AST':2+i%6,'FG3M':1+i%3,
              'MATCHUP':'BOS @ NYK' if i%2 else 'BOS vs. NYK',
          } for i in range(15)])
          row=pd.Series({
              'Zawodnik':'Fixture Player','Drużyna':'BOS',
              'Rynek':'PRA','Linia':32.5,'Wybór':'OVER',
              'Pozycja':'SF','Przeciwnik':'NYK',
              '_espn_id':'123',
              'Obrona: stracone pkt/mecz':108.5,
              'Obrona: L10 stracone':106.7,
              'Źródło statystyk':'Test fixture — verified shape',
          })
          render_player_card(
              row,rows,'2026-27',pd.Timestamp('2026-11-11T00:00:00Z'),
              slug='bb83_loaded_fixture')
          """
          at=AppTest.from_string(code,default_timeout=75).run()
          assert not at.exception,[str(x.message) for x in at.exception]
          assert any(x.key=='bb83_loaded_fixture_market' for x in at.selectbox)
          assert any(x.key=='bb83_loaded_fixture_line' for x in at.number_input)
          assert len(at.get('plotly_chart'))==1
          print('Loaded Player Props widget layout and plotted boxscore values rendered.')
          PY
      - name: Core Player Props — dynamic real history, no synthetic data
        run: |
          python - <<'PY'
          from pathlib import Path
          props=Path('mvp_player_card.py').read_text(encoding='utf8')
          search=Path('mvp_prop_ui.py').read_text(encoding='utf8')
          for s in ('render_player_card','observed_hit_rates(games,market,line)',
                    'st.plotly_chart','last5','last10','last15','HIT RATE','GAME_DATE','_plot('):
              assert s in props,s
          for s in ('parse_prop_batch','_load_full_season','_safe_catalog',
                    'analyze_season_offers','_run_research'):
              assert s in search,s
          assert 'render_screenshot_calculator' not in search
          assert 'PRA · 35.5' in search and 'bbm-pra-chip' in search
          from prop_search import parse_prop_query
          assert parse_prop_query('Jayson Tatum over 35.5 PRA')['market']=='PRA'
          assert parse_prop_query('Jayson Tatum ponizej 35,5 p+r+a')['market']=='PRA'
          print('Search and dynamic verified prop chart, PRA aliases and visible shortcuts connected')
          PY
      - name: Chronological matchup candidate holdout (optional audit)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          python - <<'PY'
          from simulation_sources import historical_espn_results
          from model_validation import evaluate_models
          results,notes=historical_espn_results('2026-27')
          _,summary=evaluate_models(results,holdout_n=40)
          print('HOLDOUT:',summary)
          print('DATA NOTES:',notes)
          PY
