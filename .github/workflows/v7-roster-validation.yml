name: BestBets v7 roster validation
on:
  push:
    branches:
      - development/v7-roster-data
      - development/v7-1-match-rosters-validation
      - fix/roster-aaron-gordon
      - feature/v7-4-performance-tracker
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  roster-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimum test dependencies
        run: python -m pip install -q pandas numpy plotly streamlit requests
      - name: Compile updated modules
        run: python -m py_compile app.py roster_data.py roster_view.py global_player_catalog.py espn_player_data.py simulation_view.py matchup_roster.py forecast_audit.py performance_tracker.py simulation_backtest.py
      - name: Unit tests for roster parsing
        run: python -m unittest -v test_roster_data.py test_matchup_roster.py test_forecast_audit.py test_calculator_catalog.py test_performance_tracker.py
      - name: Streamlit smoke check - landing page and player browser
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("app.py", default_timeout=65).run()
          assert len(at.exception) == 0, [str(e.message) for e in at.exception]
          assert len(at.sidebar.radio) > 0, "Sidebar navigation missing"
          at.sidebar.radio[0].set_value("🧑‍🚀 Zawodnicy").run()
          assert len(at.exception) == 0, [str(e.message) for e in at.exception]
          assert len(at.selectbox) >= 2, "Team or player roster selector missing"
          assert any("Stephen Curry" == str(v) for sb in at.selectbox for v in sb.options), "Stephen Curry not in GSW selector"
          print("Streamlit pages render, GSW roster and Stephen Curry selector verified")
          PY
      - name: Calculator smoke - global selector with Gordon and Curry
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file("app.py", default_timeout=90).run()
          assert not at.exception, [str(x.message) for x in at.exception]
          at.sidebar.radio[0].set_value("💹 Kursy i value").run()
          assert not at.exception, [str(x.message) for x in at.exception]
          selection=[r for r in at.radio if r.label=="Wybierz analizę kursów"]
          assert selection, "Odds analysis selector absent"
          selection[0].set_value("🧮 Kalkulator (opcjonalnie)").run()
          assert not at.exception, [str(x.message) for x in at.exception]
          players=[s for s in at.selectbox if s.label=="Wyszukaj zawodnika NBA"]
          assert players, "Global player selector absent"
          opts=list(players[0].options)
          assert any("Aaron Gordon (DEN)"==str(o) for o in opts), "Aaron Gordon missing"
          assert any("Stephen Curry (GSW)"==str(o) for o in opts), "Stephen Curry missing"
          assert not any(s.label=="Drużyna NBA" for s in at.selectbox), "Team selector still present"
          print("Calculator renders; global roster contains Gordon & Curry; team picker removed")
          PY
      - name: Tracker page Streamlit smoke
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file("app.py",default_timeout=65).run()
          assert not at.exception, [str(x.message) for x in at.exception]
          at.sidebar.radio[0].set_value("📈 Performance Tracker").run()
          assert not at.exception, [str(x.message) for x in at.exception]
          assert any(x.label=="Pobierz i rozlicz zakończone mecze" for x in at.button)
          print("Performance Tracker renders without exceptions")
          PY
      - name: Descriptive actual-season walk-forward benchmark
        continue-on-error: true
        run: |
          python - <<'PY'
          from simulation_sources import historical_espn_results
          from simulation_backtest import walk_forward_comparison
          games,notes=historical_espn_results('2026-27')
          _,metrics=walk_forward_comparison(games,max_games=140)
          print("WALKFORWARD METRICS:",metrics)
          print("ESPN WARNINGS:",notes)
          PY
      - name: Live ESPN availability diagnostic
        continue-on-error: true
        run: |
          python - <<'PY'
          from roster_data import team_roster
          for team in ("GSW", "UTA", "BOS", "DEN"):
              roster, metadata = team_roster(team)
              print(team, "players", len(roster), "source", metadata.get("source"))
              if team == "DEN":
                  print("DEN players:", roster["PLAYER_NAME"].tolist())
                  assert any("Aaron Gordon" == name for name in roster["PLAYER_NAME"]), "Aaron Gordon missing from ESPN DEN roster"
              assert len(roster) >= 8, "Too few players for " + team
              if team == "GSW":
                  assert any("Curry" in name for name in roster["PLAYER_NAME"]), "Curry missing from GSW roster"
          PY
