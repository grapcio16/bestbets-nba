name: BestBets MVP quality checks
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -q pandas numpy plotly streamlit requests pillow 'psycopg[binary]>=3.2,<4'
      - name: Compile all active screens and research engines
        run: |
          python -m py_compile app.py mvp_app.py mvp_theme.py mvp_data.py mvp_prop_ui.py mvp_player_card.py
          python -m py_compile simulation_view.py simulation_premium.py simulation_engine.py simulation_data_audit.py simulation_sources.py
          python -m py_compile roster_view.py roster_data.py global_player_catalog.py season_props.py
          python -m py_compile screenshot_ui.py screenshot_cards.py screenshot_import.py prop_search.py prediction_engine_v2.py
          python -m py_compile schedule_ui.py schedule_data.py viewer_time.py
          python -m py_compile tracker_automation.py tracker_storage.py tracker_postgres.py
      - name: Regression suite — NBA and UI business logic
        run: |
          python -m unittest -v test_player_props_pra_v82.py test_simulation_premium_v81.py test_mvp_v800.py test_prop_search_v723.py test_screenshot_v722.py test_season_props_v721.py test_tracker_v720.py test_simulation_lines_v719.py test_prediction_v718.py test_screen_v717.py test_rotation_v716.py test_simulation_data_audit.py test_center_v713.py test_center_v712.py test_center_v711.py test_schedule_v710.py test_nov8.py test_roster_data.py test_matchup_roster.py test_forecast_audit.py test_calculator_catalog.py test_performance_tracker.py test_v75.py test_v76.py test_v77.py test_v78.py test_v78_tracker.py
      - name: Product scope and research isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          import mvp_app
          from mvp_theme import MVP_CSS
          from prop_search import parse_prop_batch
          source=Path('app.py').read_text(encoding='utf8')
          assert 'from mvp_app import main' in source
          assert 'screenshot_ui' not in source and 'odds_fetcher' not in source
          core=[x for x,_ in mvp_app.MAIN_PAGES]
          extra=[x for x,_ in mvp_app.EXTRA_PAGES]
          assert core==['home','props','games','simulations','players','teams']
          assert extra==['favorites','trends','tools','settings']
          for token in ('bbm-topbar','bbm-player-head','bbm-card','bbm-sidebar-footer','--bb-orange','--bb-blue'):
              assert token in MVP_CSS,token
          assert 'score_line_probabilities(' not in Path('simulation_engine.py').read_text(), '5000-draw engine was changed'
          assert "run_scheduled_job" in Path('tracker_automation.py').read_text(), 'Tracker worker deleted'
          assert Path('.github/workflows/tracker-auto.yml').exists()
          queries,errors=parse_prop_batch('Jason Tatum uver 25,5 point\nJayson Tatum under 3.5 asist\nJayson Tatum over 2.5 three-pointers')
          assert len(queries)==3 and not errors
          assert [x['market'] for x in queries]==['PTS','AST','FG3M']
          print('MVP lean, core simulations intact, archived modules remain')
          PY
      - name: Streamlit smoke — ten navigable premium pages
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          from mvp_app import MAIN_PAGES,EXTRA_PAGES
          at=AppTest.from_file('app.py',default_timeout=90).run()
          assert not at.exception,[str(e.message) for e in at.exception]
          for name,_ in (*MAIN_PAGES,*EXTRA_PAGES):
              control=next((b for b in at.sidebar.button if b.key=='bb_nav_'+name),None)
              assert control is not None, 'Nav missing: '+name
          for name in ['props','games','simulations','players','teams','favorites','trends','tools','settings','home']:
              at.sidebar.button(key='bb_nav_'+name).click().run()
              assert not at.exception, (name,[str(e.message) for e in at.exception])
              print('Page passed:',name,flush=True)
          at.sidebar.button(key='bb_nav_props').click().run()
          assert not at.exception, [str(e.message) for e in at.exception]
          assert any(x.key=='bb_mvp_search_text' for x in at.text_input)
          assert not any(x.key=='bb717_screen_upload' for x in at.get('file_uploader'))
          print('All MVP pages plus search loaded; screenshot UI hidden')
          PY
      - name: Simulation premium details — compact responsive cards, no old debug wall
        run: |
          python - <<'PY'
          from pathlib import Path
          details=Path('simulation_view.py').read_text(encoding='utf8')
          helpers=Path('simulation_premium.py').read_text(encoding='utf8')
          assert 'game_tile_html(' in details
          assert 'matchup_hero_html(' in details
          assert 'compact_team_context_html(' in details
          assert 'player_previews_html(' in details
          assert 'for index in range(0,len(games_list),2):' in details
          assert "view==\"🔬 Dane i metodologia\"" in details
          assert '🩺 Rotacja i absencje' in details
          assert '🎯 Linie i wrażliwość' in details
          assert '📊 Rozkład punktów' in details
          assert 'player_previews_html' in helpers
          assert 'saved forecasts' not in helpers
          print('New compact simulation game and matchup details are wired')
          PY
      - name: Core Player Props — dynamic real history, no synthetic data
        run: |
          python - <<'PY'
          from pathlib import Path
          props=Path('mvp_player_card.py').read_text(encoding='utf8')
          search=Path('mvp_prop_ui.py').read_text(encoding='utf8')
          for s in ('render_player_card','observed_hit_rates(games,market,line)',
                    'st.plotly_chart','last5','last10','last15','HIT RATE','GAME_DATE','_plot('):
              assert s in props,s
          for s in ('parse_prop_batch','_load_full_season','_safe_catalog',
                    'analyze_season_offers','_run_research'):
              assert s in search,s
          assert 'render_screenshot_calculator' not in search
          assert 'PRA · 35.5' in search and 'bbm-pra-chip' in search
          from prop_search import parse_prop_query
          assert parse_prop_query('Jayson Tatum over 35.5 PRA')['market']=='PRA'
          assert parse_prop_query('Jayson Tatum ponizej 35,5 p+r+a')['market']=='PRA'
          print('Search and dynamic verified prop chart, PRA aliases and visible shortcuts connected')
          PY
      - name: Chronological matchup candidate holdout (optional audit)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          python - <<'PY'
          from simulation_sources import historical_espn_results
          from model_validation import evaluate_models
          results,notes=historical_espn_results('2026-27')
          _,summary=evaluate_models(results,holdout_n=40)
          print('HOLDOUT:',summary)
          print('DATA NOTES:',notes)
          PY
