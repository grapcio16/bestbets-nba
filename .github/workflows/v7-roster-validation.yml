name: BestBets automated quality checks
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

# One check per Pull Request commit instead of overlapping push+PR runs.
# Cancel superseded test runs after each new commit.
concurrency:
  group: bestbets-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  roster-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimum test dependencies
        run: python -m pip install -q pandas numpy plotly streamlit requests 'psycopg[binary]>=3.2,<4'
      - name: Compile updated modules
        run: python -m py_compile screenshot_import.py screenshot_ui.py rotation_intelligence.py simulation_data_audit.py simulation_sources.py model_validation.py center_leaderboard.py schedule_ui.py schedule_data.py viewer_time.py dashboard_data.py app.py roster_data.py roster_view.py global_player_catalog.py espn_player_data.py simulation_view.py matchup_roster.py forecast_audit.py performance_tracker.py simulation_backtest.py tracker_storage.py tracker_postgres.py match_context.py forecast_quality.py availability_context.py opponent_ratings.py model_validation.py
      - name: Unit tests for roster parsing
        run: python -m unittest -v test_screen_v717.py test_rotation_v716.py test_simulation_data_audit.py test_center_v713.py test_center_v712.py test_center_v711.py test_schedule_v710.py test_nov8.py test_roster_data.py test_matchup_roster.py test_forecast_audit.py test_calculator_catalog.py test_performance_tracker.py test_v75.py test_v76.py test_v77.py test_v78.py test_v78_tracker.py
      - name: v7.17 screenshot batch calculator smoke (no OCR server dependency)
        run: |
          python - <<'PY'
          from pathlib import Path
          from streamlit.testing.v1 import AppTest
          src=Path("screenshot_ui.py").read_text(encoding="utf-8")
          assert "st.file_uploader(" in src and "st.data_editor(" in src
          assert "bb717_verified" in src and "batch_analyze(" in src
          assert "batch_analyze(" not in Path("simulation_engine.py").read_text()
          at=AppTest.from_file("app.py",default_timeout=90).run()
          assert not at.exception,[str(x.message) for x in at.exception]
          at.sidebar.radio[0].set_value("💹 Kursy i value").run()
          assert not at.exception,[str(x.message) for x in at.exception]
          option=next(r for r in at.radio if r.key=="bb64_odds_view")
          option.set_value("🧮 Kalkulator (opcjonalnie)").run()
          assert not at.exception,[str(x.message) for x in at.exception]
          new=next(r for r in at.radio if r.key=="bb717_calculator_mode")
          assert new.value.startswith("📷")
          assert "👤 Kalkulator pojedynczego zawodnika" in new.options
          print("v7.17 uploader/editor exists; legacy calculator remains selectable")
          PY
      - name: v7.16 rotation analysis isolated from team-score model
        run: |
          python - <<'PY'
          from pathlib import Path
          from streamlit.testing.v1 import AppTest
          code=Path('simulation_view.py').read_text(encoding='utf-8')
          assert "'🩺 Rotacja i absencje'" in code
          assert "minutes_trends(logs,g['start_utc'],g['home'],g['away'])" in code
          assert "rotation_report(" in code
          at=AppTest.from_file('app.py',default_timeout=90).run()
          assert not at.exception,[str(e.message) for e in at.exception]
          at.sidebar.radio[0].set_value('🏀 Symulacje 5000').run()
          assert not at.exception,[str(e.message) for e in at.exception]
          print('Research-only rotation context and unchanged general simulation page passed')
          PY
      - name: v7.15 research controls do not alter default simulations
        run: |
          python - <<'PY'
          from pathlib import Path
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file("app.py",default_timeout=90).run()
          assert not at.exception, [str(e.message) for e in at.exception]
          at.sidebar.radio[0].set_value("🏀 Symulacje 5000").run()
          assert not at.exception, [str(e.message) for e in at.exception]
          research=[x for x in at.toggle if x.key=="bb715_older_history"]
          assert len(research)==1 and research[0].value is False
          buttons=[x for x in at.button if x.key=="bb715_advanced_refresh"]
          assert len(buttons)==1
          code=Path("simulation_view.py").read_text(encoding="utf-8")
          assert "lookback_months=6 if extended else 3" in code
          assert "select_matchup_means" in code
          print("Optional research only. Existing model toggles preserved.")
          PY
      - name: November 8 public UI checks
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file("app.py",default_timeout=90).run()
          assert not at.exception, [str(e.message) for e in at.exception]
          assert "📱 Telefon i publikacja" not in at.sidebar.radio[0].options
          tz=[x for x in at.sidebar.selectbox if x.label=="Strefa czasowa"]
          assert len(tz)==1 and "America/Chicago" in tz[0].options
          assert "Asia/Tokyo" in tz[0].options
          at.sidebar.radio[0].set_value("📆 Terminarz").run()
          assert not at.exception, [str(e.message) for e in at.exception]
          print("Nov 8: new navigation, all IANA timezones, and schedule render OK")
          PY
      - name: v7.10 navigation - Center and Schedule calendar controls
        run: |
          python - <<'PY'
          from datetime import date,timedelta
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file("app.py",default_timeout=90).run()
          assert not at.exception, [str(e.message) for e in at.exception]
          prev=next(b for b in at.button if b.key=="center_previous_day")
          nextday=next(b for b in at.button if b.key=="center_next_day")
          today=next(b for b in at.button if b.key=="center_today")
          picker=next(p for p in at.date_input if p.key=="bb_schedule_calendar")
          start=picker.value
          prev.click().run()
          assert not at.exception, [str(e.message) for e in at.exception]
          assert next(p for p in at.date_input if p.key=="bb_schedule_calendar").value==start-timedelta(days=1)
          next(b for b in at.button if b.key=="center_next_day").click().run()
          assert next(p for p in at.date_input if p.key=="bb_schedule_calendar").value==start
          next(p for p in at.date_input if p.key=="bb_schedule_calendar").set_value(date(2026,11,12)).run()
          assert next(p for p in at.date_input if p.key=="bb_schedule_calendar").value==date(2026,11,12)
          at.sidebar.radio[0].set_value("📆 Terminarz").run()
          assert not at.exception, [str(e.message) for e in at.exception]
          assert next(p for p in at.date_input if p.key=="bb_schedule_calendar").value==date(2026,11,12)
          assert any(b.key=="schedule_previous_day" for b in at.button)
          assert any(b.key=="schedule_next_day" for b in at.button)
          assert any(t.key=="bb_schedule_table_mode" for t in at.toggle)
          print("v7.10: date buttons, manual calendar and shared selected date verified")
          PY
      - name: Center v7.11 compact dashboard smoke
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file("app.py",default_timeout=90).run()
          assert not at.exception, [str(e.message) for e in at.exception]
          labels={x.label for x in at.metric}
          assert "Terminarz" not in labels, labels
          assert "Sezon" not in labels, labels
          assert "Rynki zawodników" not in labels, labels
          assert "Kursy" not in labels, labels
          assert any(b.key=="center_previous_day" for b in at.button), "Center date navigation removed"
          assert any(p.key=="bb_schedule_calendar" for p in at.date_input), "Calendar missing"
          print("Redundant dashboard KPIs gone; fixture navigation remains available")
          PY
      - name: Streamlit smoke check - landing page and player browser
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("app.py", default_timeout=65).run()
          assert len(at.exception) == 0, [str(e.message) for e in at.exception]
          assert len(at.sidebar.radio) > 0, "Sidebar navigation missing"
          at.sidebar.radio[0].set_value("🧑‍🚀 Zawodnicy").run()
          assert len(at.exception) == 0, [str(e.message) for e in at.exception]
          assert len(at.selectbox) >= 2, "Team or player roster selector missing"
          assert any("Stephen Curry" == str(v) for sb in at.selectbox for v in sb.options), "Stephen Curry not in GSW selector"
          print("Streamlit pages render, GSW roster and Stephen Curry selector verified")
          PY
      - name: Calculator smoke - global selector with Gordon and Curry
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file("app.py", default_timeout=90).run()
          assert not at.exception, [str(x.message) for x in at.exception]
          at.sidebar.radio[0].set_value("💹 Kursy i value").run()
          assert not at.exception, [str(x.message) for x in at.exception]
          selection=[r for r in at.radio if r.label=="Wybierz analizę kursów"]
          assert selection, "Odds analysis selector absent"
          selection[0].set_value("🧮 Kalkulator (opcjonalnie)").run()
          assert not at.exception, [str(x.message) for x in at.exception]
          modes=[r for r in at.radio if r.key=="bb717_calculator_mode"]
          assert modes, "Calculator mode selector absent"
          modes[0].set_value("👤 Kalkulator pojedynczego zawodnika").run()
          assert not at.exception, [str(x.message) for x in at.exception]
          players=[s for s in at.selectbox if s.label=="Wyszukaj zawodnika NBA"]
          assert players, "Global player selector absent"
          opts=list(players[0].options)
          assert any("Aaron Gordon (DEN)"==str(o) for o in opts), "Aaron Gordon missing"
          assert any("Stephen Curry (GSW)"==str(o) for o in opts), "Stephen Curry missing"
          assert not any(s.label=="Drużyna NBA" for s in at.selectbox), "Team selector still present"
          print("Calculator renders; global roster contains Gordon & Curry; team picker removed")
          PY
      - name: Tracker page Streamlit smoke
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file("app.py",default_timeout=65).run()
          assert not at.exception, [str(x.message) for x in at.exception]
          at.sidebar.radio[0].set_value("📈 Performance Tracker").run()
          assert not at.exception, [str(x.message) for x in at.exception]
          assert any(x.label=="Pobierz i rozlicz zakończone mecze" for x in at.button)
          print("Performance Tracker renders without exceptions")
          PY
      - name: Descriptive actual-season walk-forward benchmark
        continue-on-error: true
        run: |
          python - <<'PY'
          from simulation_sources import historical_espn_results
          from simulation_backtest import walk_forward_comparison
          games,notes=historical_espn_results('2026-27')
          _,metrics=walk_forward_comparison(games,max_games=140)
          print("WALKFORWARD METRICS:",metrics)
          print("ESPN WARNINGS:",notes)
          PY
      - name: Tracker storage selection and context smoke
        run: |
          python - <<'PY'
          from tracker_storage import tracker_backend
          from match_context import team_schedule_context
          import pandas as pd
          assert tracker_backend()['remote'] is False
          sample=pd.DataFrame([{'start_utc':'2026-11-06T22:00:00Z',
              'home':'SAS','away':'POR','home_score':119,'away_score':105,
              'status_code':3}])
          d=team_schedule_context(sample,'SAS','2026-11-07T23:00:00Z')
          assert d['back_to_back'] and d['rest_days']==0
          print('v7.5 storage fallback and rest diagnostics OK')
          PY
      - name: Chronological NBA candidate model holdout (research)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python - <<'PY'
          from simulation_sources import historical_espn_results
          from model_validation import evaluate_models
          games,notes=historical_espn_results('2026-27')
          frame,summary=evaluate_models(games,holdout_n=40)
          print("OPPONENT_HOLDOUT_RESULTS:",summary,flush=True)
          print("OPPONENT_HOLDOUT_DATA_WARNINGS:",notes,flush=True)
          if not summary:
              print("CANDIDATE NOT VALIDATED: insufficient completed games",flush=True)
          PY
      - name: Live ESPN availability diagnostic
        continue-on-error: true
        run: |
          python - <<'PY'
          from roster_data import team_roster
          for team in ("GSW", "UTA", "BOS", "DEN"):
              roster, metadata = team_roster(team)
              print(team, "players", len(roster), "source", metadata.get("source"))
              if team == "DEN":
                  print("DEN players:", roster["PLAYER_NAME"].tolist())
                  assert any("Aaron Gordon" == name for name in roster["PLAYER_NAME"]), "Aaron Gordon missing from ESPN DEN roster"
              assert len(roster) >= 8, "Too few players for " + team
              if team == "GSW":
                  assert any("Curry" in name for name in roster["PLAYER_NAME"]), "Curry missing from GSW roster"
          PY
