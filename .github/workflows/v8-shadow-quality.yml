name: V8 independent Shadow — evidence and model QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-model-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated V8 requirements
        run: python -m pip install -q 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'requests>=2.31,<3'
      - name: Compile V8 independently of V7
        run: python -m compileall -q v8_shadow test_v8_shadow_engine.py test_v8_shadow_data.py
      - name: V8 no-fabricated-stats / chronology / joint-score regression
        run: python -m unittest -v test_v8_shadow_engine test_v8_shadow_data test_v8_shadow_pipeline
      - name: Read-only one-game live ESPN schema diagnostic
        continue-on-error: true
        run: python -m v8_shadow.smoke
