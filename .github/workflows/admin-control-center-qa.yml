name: Control Center QA
on:
  pull_request:
    paths:
      - 'admin_control_center.py'
      - 'admin_data_intelligence.py'
      - 'admin_source_monitor.py'
      - 'admin_performance.py'
      - 'test_admin_performance.py'
      - 'test_admin_source_monitor.py'
      - 'test_admin_control_center.py'
      - 'test_admin_data_intelligence.py'
      - 'app.py'
      - '.github/workflows/admin-control-center-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q admin_control_center.py admin_data_intelligence.py admin_source_monitor.py admin_performance.py app.py
      - run: python -m unittest -v test_admin_control_center test_admin_data_intelligence test_admin_source_monitor test_admin_performance
