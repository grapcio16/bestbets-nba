name: BestBets isolated account demo
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bestbets_test
          POSTGRES_PASSWORD: ci_sandbox_only
          POSTGRES_DB: bestbets_billing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bestbets_test -d bestbets_billing_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_BILLING_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://bestbets_test:ci_sandbox_only@127.0.0.1:5432/bestbets_billing_test' || '' }}
      TEST_DEMO_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://bestbets_test:ci_sandbox_only@127.0.0.1:5432/bestbets_demo_test' || '' }}
      BILLING_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://bestbets_test:ci_sandbox_only@127.0.0.1:5432/bestbets_demo_test' || 'sqlite:////tmp/bestbets-demo-migrations.sqlite3' }}
      BILLING_ALLOW_SQLITE_TEST: ${{ matrix.database == 'sqlite' && 'true' || 'false' }}
      DEMO_SCREENSHOT_DIR: test-results/screenshots
      DEMO_TRACE_DIR: test-results/traces
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated demo dependencies and Chromium
        run: |
          python -m pip install -r requirements-billing-demo.txt 'pytest>=8,<10' 'playwright>=1.58,<2'
          python -m playwright install --with-deps chromium
      - name: Create dedicated PostgreSQL demo database
        if: matrix.database == 'postgres'
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://bestbets_test:ci_sandbox_only@127.0.0.1:5432/bestbets_billing_test', autocommit=True) as conn:
              conn.execute('CREATE DATABASE bestbets_demo_test')
          PY
      - name: Check migrations
        run: |
          python -m alembic -c alembic-billing.ini upgrade head
          python -m alembic -c alembic-billing.ini check
      - name: Browser flow, OIDC security and subscription authorization
        run: python -m pytest -q billing_backend/tests billing_demo/tests test_stripe_test_billing.py --junitxml=test-results/tests.xml
      - name: Public application remains unchanged
        if: github.event_name == 'pull_request'
        env:
          DEMO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --exit-code "$DEMO_BASE_SHA" HEAD -- app.py bestbets_custom_screen.py bestbets_reference_frontend assets requirements.txt
      - name: Check committed credential patterns
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          pattern = re.compile(r'(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{24,}|whsec_[A-Za-z0-9]{24,}|-----BEGIN (?:RSA )?PRIVATE KEY-----')
          paths = [p for p in Path('billing_demo').rglob('*') if p.suffix in ('.py','.js','.html','.css')]
          paths += [Path('billing_demo/.env.example'), Path('docs/AUTH0_STRIPE_DEMO_SETUP.md')]
          for path in paths:
              assert not pattern.search(path.read_text()), f'Possible credential in {path}'
          print('No realistic credential material found in demo sources.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bestbets-account-demo-${{ matrix.database }}
          path: test-results/
