name: Hoopzaro Premium Scenario Builder V2 visual QA

on:
  pull_request:
    branches: [main, feature/premium-team-comparison-v2-visual]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenario-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and app dependencies
        run: |
          python -m pip install -r requirements.txt 'playwright>=1.58,<2'
          python -m playwright install --with-deps chromium
      - name: Verify UI isolation and no fake pregame results
        run: |
          node --check bestbets_reference_frontend/simulations.js
          python -m py_compile test_scenario_builder_browser.py
          python - <<'PY'
          from pathlib import Path
          import re
          base=Path('bestbets_reference_frontend')
          html=(base/'index.html').read_text(encoding='utf-8')
          css=(base/'scenario_builder_premium_v2.css').read_text(encoding='utf-8')
          js=(base/'simulations.js').read_text(encoding='utf-8')
          assert 'href="scenario_builder_premium_v2.css"' in html
          assert 'hzm-scenario-premium-v2' in html
          assert 'EKSPERYMENTALNE · WHAT-IF' in html
          assert 'id="hzm-scenario-base"' in html
          assert 'id="hzm-scenario-whatif"' in html
          assert 'id="hzm-scenario-curve"' in html
          assert 'hzm-scenario-premium-v2' in css
          assert '"scenario"].includes' in html
          assert 'record?.scenario_distribution' in js
          assert 'if(!ready)' in js
          assert 'id="hzm-lab-tab-flow"' in html
          assert 'tabindex="-1" hidden disabled' in html
          ids=re.findall(r'\bid="(hzm-scenario-[a-z0-9-]+)"',html)
          assert len(ids)==len(set(ids)), 'Duplicate Scenario Builder IDs'
          print('Scenario UI is scoped; unavailable results are not painted as real.')
          PY
      - name: Chromium V7.4 what-if result, exact differences, Premium gate, desktop and phone
        run: python test_scenario_builder_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hoopzaro-scenario-v2-browser-screenshots
          path: test-results/hoopzaro-scenario-v2/*.png
          if-no-files-found: ignore
