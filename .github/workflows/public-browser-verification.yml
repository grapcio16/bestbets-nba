name: Hoopzaro public browser verification
on:
  push:
    branches: [qa/public-browser-access]
    paths: ['.github/workflows/public-browser-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install 'playwright>=1.58,<2'
          python -m playwright install --with-deps chromium
      - name: Verify public guest view without credentials
        run: |
          mkdir -p public-qa
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json
          out=Path("public-qa")
          results=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for label,url in [("hosting","https://hoopzaro.streamlit.app"),("domain","https://hoopzaro.com")]:
                  ctx=browser.new_context(viewport={"width":1672,"height":941})
                  page=ctx.new_page()
                  record={"target":label,"url":url,"settings_v2":False}
                  try:
                      response=page.goto(url,wait_until="domcontentloaded",timeout=45000)
                      record["http_status"]=response.status if response else None
                      import time
                      deadline=time.monotonic()+70
                      frame=None
                      while time.monotonic()<deadline:
                          for candidate in page.frames:
                              try:
                                  if candidate.locator('.nav-btn[data-page="settings"]').first.is_visible():
                                      frame=candidate
                                      break
                              except Exception:
                                  continue
                          if frame is not None:
                              break
                          page.wait_for_timeout(500)
                      record["frame_count"]=len(page.frames)
                      if frame is None:
                          raise TimeoutError("Public navigation not visible")
                      record["navigation_visible"]=True
                      page.screenshot(path=str(out/f"{label}-home.png"))
                      # Inspect the actually served, public JS asset, not the GitHub source.
                      from urllib.parse import urljoin, urlsplit
                      asset_url=frame.evaluate("() => [...document.scripts].find(s=>s.src && new URL(s.src).pathname.endsWith('/centrum.js'))?.src || ''")
                      record["centrum_asset_verified"]=False
                      if asset_url and urlsplit(asset_url).netloc==urlsplit(frame.url).netloc:
                          asset=ctx.request.get(asset_url,timeout=15000)
                          if asset.ok:
                              source=asset.text()
                              record["centrum_asset_verified"]="function nextGameOnEmptyDay(" in source and "Najbliższy:" in source
                      game_list=frame.locator("#bc-games-list")
                      record["centrum_fallback_visible"]=game_list.locator(".bc-muted").filter(has_text="Najbliższy:").count()>0
                      if record["centrum_fallback_visible"]:
                          record["centrum_fallback_rows"]=game_list.locator(".bc-game").count()
                          if record["centrum_fallback_rows"]==1:
                              game_list.locator(".bc-game").click(timeout=15000)
                              frame.locator("#bc-dialog-body").wait_for(state="visible",timeout=15000)
                              page.screenshot(path=str(out/f"{label}-nearest-game.png"))
                              page.keyboard.press("Escape")
                      for section,selector in [("players","#hzp-players-pane"),("teams","#hzt-teams-pane")]:
                          frame.locator(f'.nav-btn[data-page="{section}"]').first.click(timeout=15000)
                          frame.locator(selector).wait_for(state="visible",timeout=15000)
                          page.screenshot(path=str(out/f"{label}-{section}.png"))
                      frame.locator('.nav-btn[data-page="settings"]').first.click(timeout=15000)
                      frame.locator('#hz-account').wait_for(state="visible",timeout=15000)
                      record["settings_v2"]=frame.locator(".hza-tile").count()==7
                      record["tile_count"]=frame.locator(".hza-tile").count()
                      record["guest"]=frame.locator("#hz-account-role").inner_text()=="GOŚĆ"
                      record["admin_hidden"]=frame.locator("#hz-admin-nav").is_hidden()
                      if record["guest"] and record["admin_hidden"]:
                          page.screenshot(path=str(out/f"{label}-settings.png"))
                          if record["settings_v2"]:
                              frame.locator('.hza-tile[data-hza-open="profile"]').click()
                              frame.locator("#hza-dialog").wait_for(state="visible")
                              page.screenshot(path=str(out/f"{label}-profile.png"))
                      record["ok"]=record["settings_v2"] and record["guest"] and record["admin_hidden"] and record["centrum_asset_verified"] and (not record["centrum_fallback_visible"] or record.get("centrum_fallback_rows")==1)
                  except Exception as exc:
                      record["ok"]=False
                      record["error_type"]=type(exc).__name__
                      # No HTML, logs, URL query parameters, tokens or credentials exported.
                      page.screenshot(path=str(out/f"{label}-unverified.png"))
                  finally:
                      ctx.close()
                      results.append(record)
              browser.close()
          (out/"result.json").write_text(json.dumps(results,indent=2),encoding="utf-8")
          print(json.dumps(results,indent=2))
          if not all(r.get("ok") for r in results):
              raise SystemExit("One or more public targets could not be verified")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-browser-qa
          path: public-qa/
          retention-days: 7
