name: Billing sandbox policy QA
on:
  pull_request:
    paths:
      - 'billing_sandbox*.py'
      - 'test_billing_sandbox*.py'
      - 'migrations/billing_sandbox_v1.sql'
      - 'test_billing_sandbox_policy.py'
      - '.github/workflows/billing-sandbox-policy-qa.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'stripe>=11,<13'
      - run: python -m py_compile billing_sandbox_policy.py billing_sandbox_adapter.py billing_sandbox_store.py billing_sandbox_webhook.py billing_sandbox_app.py
      - run: python -m unittest -v test_billing_sandbox_policy test_billing_sandbox_adapter
